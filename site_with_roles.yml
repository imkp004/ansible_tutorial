---

- hosts: all
  become: true
  pre_tasks:

    - name: install updates on ubuntu
      tags: always
      apt: 
        upgrade: dist
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: install updates on Amazon
      tags: always
      dnf: 
        update_only: yes
        update_cache: yes
      when: ansible_os_family == "RedHat"     

- hosts: all
  become: true
  roles:
    - base


- hosts: workstations
  become: true
  roles:
    - workstations


- hosts: web-server
  become: true
  roles:
    - web-server


- hosts: db-server
  become: true
  roles:
    - db-server
