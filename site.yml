---

- hosts: all
  become: true
  pre_tasks:

    - name: install updates on ubuntu
      tags: always
      apt: 
        upgrade: dist
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: install updates on Amazon
      tags: always
      dnf: 
        update_only: yes
        update_cache: yes
      when: ansible_os_family == "RedHat"     

- hosts: all
  become: true
  tasks:

    - name: create kirtan user
      tags: always
      user:
        name: kirtan
        groups: root

    - name: add ssh for kirtan user
      tags: always
      authorized_key:
        user: kirtan
        key: "ssh-rsa  kirtan-key"


    - name: Install sudoers file for kirtan
      copy:
        src: sudoers_kirtan
        dest: /etc/sudoers.d/kirtan
        owner: root
        group: root
        mode: '0440'


- hosts: workstations
  become: true
  tasks:

    - name: install unzip
      package:
        name: unzip

    - name: install terraform
      unarchive:
        src: https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
        dest: /usr/local/bin
        remote_src: yes
        mode: 0755
        owner: root
        group: root        



- hosts: web-server
  become: true
  tasks:

    - name: install apache2 package in ubuntu
      tags: apache,apache2,ubuntu
      apt: 
        name: apache2
        state: present
      when: ansible_os_family == "Debian"
    
    - name: install httpd package in amazon linux
      tags: apache,httpd,amazon  
      dnf:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start starting on Amazon Linux
      tags: apache,httpd,amazon
      service:
        name: httpd
        state: started
        enabled: true
      when: ansible_os_family == "RedHat"

    - name: Copy default file to server
      tags: apache,httpd,amazon,ubuntu
      copy:
        src: default.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644

- hosts: db-server
  become: true

  tasks:
    - name: Install Mariadb in amazon family
      tags: mariadb,amazon
      dnf:
        name: mariadb105-server
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install mariadb in debian family
      tags: mariadb,ubuntu
      apt:
        name: mariadb-server
        state: present
      when: ansible_os_family == "Debian"
    - name: Install samba package
      tags: samba,amazon,ubuntu
      package:
        name: samba
        state: present
