---

- hosts: all
  become: true
  tasks:
    - name: install apache2 package in ubuntu
      apt: 
        name: apache2
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"
    - name: Start Apache on Ubuntu
      service:
        name: apache2
        state: started
        enabled: true
      when: ansible_os_family == "Debian"
    
    - name: install httpd package in amazon linux  
      dnf:
        name: httpd
        state: present
      when: ansible_distribution == "Amazon"

    - name: Start Apache on Amazon Linux
      service:
        name: httpd
        state: started
        enabled: true
      when: ansible_distribution == "Amazon"
