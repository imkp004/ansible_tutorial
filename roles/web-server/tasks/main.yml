- name: install apache2 package in ubuntu
  tags: apache,apache2,ubuntu
  apt:
    name: apache2
    state: present
  when: ansible_os_family == "Debian"

- name: install httpd package in amazon linux
  tags: apache,httpd,amazon
  dnf:
    name: httpd
    state: present
  when: ansible_os_family == "RedHat"

- name: Start starting on Amazon Linux
  tags: apache,httpd,amazon
  service:
    name: httpd
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Copy default file to server
  tags: apache,httpd,amazon,ubuntu
  copy:
    src: default.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: 0644
