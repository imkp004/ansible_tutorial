- name: create kirtan user
  tags: always
  user:
    name: kirtan
    groups: root

- name: add ssh for kirtan user
  tags: always
  authorized_key:
    user: kirtan
    key: "ssh-rsa  kirtan-key"

- name: Install sudoers file for kirtan
  copy:
    src: sudoers_kirtan
    dest: /etc/sudoers.d/kirtan
    owner: root
    group: root
    mode: '0440'


